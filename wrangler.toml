# 弓道部的中ノートの Gemini 中継（Cloudflare Workers）。
#
#   npx wrangler deploy                    … 配る
#   npx wrangler secret put GEMINI_API_KEY … 鍵を置く（一度だけ。束には入れない）
#   npx wrangler tail                      … 動いている様子を見る
#
# アプリは Firebase のログインの証（ID トークン）を Authorization に付けて
# ここを呼ぶ。中継が証を確かめてから、鍵を付けて Gemini を呼ぶ。
name = "kyudo-gemini-chukei"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# 証を受け付ける Firebase の企画（本番と検証環境）
FIREBASE_PROJECT_IDS = "kyudoscoremanager,kyudoscoremanager-stg"
# 呼んでよい出どころ（CORS）。検証は手元の配り口も許す
ALLOWED_ORIGINS = "https://kyudoscoremanager.web.app,https://kyudoscoremanager.firebaseapp.com,https://kyudoscoremanager-stg.web.app,https://kyudoscoremanager-stg.firebaseapp.com,http://localhost:8090,http://localhost:8091,http://127.0.0.1:8090,http://127.0.0.1:8091,http://localhost:8081"
# 呼んでよい模型
ALLOWED_MODELS = "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash,gemini-2.5-flash-lite,gemini-1.5-flash"
# 模型の切り替えの並び。使う模型が混んでいる・上限・無いときは、要求した模型のあと、この並びの残りを順に試す。
# MODEL_CHAIN … 写真の読み取りなど（3.8・3.7 は写真の読み取りが 100 秒を超えて 15 枚中 2〜3 枚しか通らなかったので入れない。3.5 は考えない設定で 11/15）
# MODEL_CHAIN_STREAM … AI チャット（3.8・3.7 は 3 問とも正しく答えた）
MODEL_CHAIN = "gemini-3.6-flash,gemini-3.5-flash"
MODEL_CHAIN_STREAM = "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash"

# 人ごとの回数の上限（1分あたり）。鍵を抜かれなくても、1人が回し続けるのを止める
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

# 改善のための保存（/hozon）の上限。写真を読むと 1 回で最大 6 回（文字 1・写真 5）送るので別に数える
[[ratelimits]]
name = "RATE_HOZON"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# アプリの改善のための保存（src/hozon.mjs）。文字は D1、写真・PDF は KV。2026-09-26 に作った
[[d1_databases]]
binding = "KAIZEN_DB"
database_name = "kyudo-kaizen"
database_id = "a98a2544-4879-4845-adc1-df220d31a0b5"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KAIZEN_PHOTOS"
id = "775e947b450f4aa69def0d70d90ad1ba"

# 1 年を過ぎた保存を消す定時の処理（毎日 3:17 JST）
[triggers]
crons = ["17 18 * * *"]

# 実行場所。Google の Gemini API は、呼ぶ側の場所（Cloudflare の拠点）が未対応の地域だと
# 「User location is not supported」の 400 を返す。拠点は呼んだ人の近くで決まり、日によって・時刻によって
# 通ったり通らなかったりした（2026-09-29 に gemini-3.6-flash・3.8-flash が同じ時刻に 400）。
# 日本（Google Cloud 東京）の近くに固定する
[placement]
region = "gcp:asia-northeast1"
