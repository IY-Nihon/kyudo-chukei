# 弓道部的中ノートの Gemini 中継（Cloudflare Workers）。
#
#   npx wrangler deploy                    … 配る
#   npx wrangler secret put GEMINI_API_KEY … 鍵を置く（一度だけ。束には入れない）
#   npx wrangler secret put FIREBASE_SA_KEYS … 部員のログインの確かめ（/kojin）に使うサービスアカウントの鍵（README の「部員のログイン」）
#   npx wrangler tail                      … 動いている様子を見る
#
# アプリは Firebase のログインの証（ID トークン）を Authorization に付けて
# ここを呼ぶ。中継が証を確かめてから、鍵を付けて Gemini を呼ぶ。
name = "kyudo-gemini-chukei"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# 証を受け付ける Firebase の企画（本番と検証環境）
FIREBASE_PROJECT_IDS = "kyudoscoremanager,kyudoscoremanager-stg"
# 呼んでよい出どころ（CORS）。検証は手元の配り口も許す
ALLOWED_ORIGINS = "https://kyudoscoremanager.web.app,https://kyudoscoremanager.firebaseapp.com,https://kyudoscoremanager-stg.web.app,https://kyudoscoremanager-stg.firebaseapp.com,http://localhost:8090,http://localhost:8091,http://127.0.0.1:8090,http://127.0.0.1:8091,http://localhost:8081"
# 呼んでよい模型
ALLOWED_MODELS = "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-2.5-flash,gemini-2.5-flash-lite,gemini-1.5-flash"
# 模型の切り替えの並び。使う模型が混んでいる・上限・無いときは、要求した模型のあと、この並びの残りを順に試す。
# MODEL_CHAIN … 写真の読み取りなど。切り替え先は考える量 0（考えない体）。2026-10-13 16時から 3.6・3.5 が 503 のまま読めなくなったので 3.8・3.7 を足した（3.8 は量 0 で 6〜77 秒、18 回中 17 回正しく読めた）
# 2026-10-25：写真の読み取りの切り替え先は 3.5 を先に。10/16〜24 に切り替え先で答えたのは 3.5 が 13 回・3.7 が 2 回・3.8 が 1 回で、
#   3.8・3.7 は 45 秒ずつ待って打ち切ることが多く、3.5 が答えるまで 70〜150 秒かかっていた
# MODEL_CHAIN_STREAM … AI チャット。頼んだ模型に関わらず先頭（3.8）から試す（2026-10-13。3.8 は考える量 1024 で平均 5.5 秒）
# どちらも、直近 30 分に答えた模型があれば、それを先頭に回す（src/index.mjs の 答えた模型を見る長さ）
MODEL_CHAIN = "gemini-3.6-flash,gemini-3.5-flash,gemini-3.8-flash,gemini-3.7-flash"
MODEL_CHAIN_STREAM = "gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash"
# App Check の印（X-Firebase-AppCheck）の扱い。log … 確かめて数えるだけ（呼んだ記録の appcheck）。enforce … 無い・正しくないものを断る。
# 中継の記録で印の無い呼び出しが減ってから enforce にする（README の「App Check」）
# 2026-11-13 enforce にした：11/8 から数えて、ふつうの利用 15 回は全部 ok、印なしは 11/12 夜の攻撃の試しの 6 回だけだった（本人「やって」）
# 戻すときは "log" にして配る
APPCHECK_MODE = "enforce"
# 強いない企画（, 区切り）。検証環境の束には App Check の鍵を入れていないので外す
APPCHECK_SKIP_PROJECTS = "kyudoscoremanager-stg"

# 人ごとの回数の上限（1分あたり）。鍵を抜かれなくても、1人が回し続けるのを止める
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

# 全員合わせた回数の上限（1分あたり。2026-11-03）。匿名のログインを作り替えながら呼び続けて、Gemini の 1 日の枠を
# 使い切られるのを止める。ふだんの使い方（数十の団体）では届かない数にしてある。数えるのは Cloudflare の拠点ごと
[[ratelimits]]
name = "RATE_ALL"
namespace_id = "1003"
simple = { limit = 300, period = 60 }

# 改善のための保存（/hozon）の上限。写真を読むと 1 回で最大 6 回（文字 1・写真 5）送るので別に数える
[[ratelimits]]
name = "RATE_HOZON"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# 部員のログインの確かめ（POST /kojin。src/kojin.mjs。2026-11-04）の回数の上限。個人ID の総当たりを止める。
# 通信元（IP）ごとに 1 分 10 回（打ち間違いには十分）・団体ごとに 1 分 60 回（部員が一度に入る練習の始めでも届かない）
[[ratelimits]]
name = "RATE_KOJIN"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RATE_KOJIN_GROUP"
namespace_id = "1005"
simple = { limit = 60, period = 60 }

# アプリの改善のための保存（src/hozon.mjs）。文字は D1、写真・PDF は KV。2026-09-26 に作った
[[d1_databases]]
binding = "KAIZEN_DB"
database_name = "kyudo-kaizen"
database_id = "a98a2544-4879-4845-adc1-df220d31a0b5"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KAIZEN_PHOTOS"
id = "775e947b450f4aa69def0d70d90ad1ba"

# 1 年を過ぎた保存を消す定時の処理（毎日 3:17 JST）
[triggers]
crons = ["17 18 * * *"]

# 実行場所。Google の Gemini API は、呼ぶ側の場所（Cloudflare の拠点）が未対応の地域だと
# 「User location is not supported」の 400 を返す。拠点は呼んだ人の近くで決まり、日によって・時刻によって
# 通ったり通らなかったりした（2026-09-29 に gemini-3.6-flash・3.8-flash が同じ時刻に 400）。
# 日本（Google Cloud 東京）の近くに固定する
[placement]
region = "gcp:asia-northeast1"
